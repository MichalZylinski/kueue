# permissions for end users to edit jobs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flinkdeployment-editor-role
  labels:
    rbac.kueue.x-k8s.io/role: "flinkdeployment-editor"
    rbac.kueue.x-k8s.io/batch-admin: "true"
    rbac.kueue.x-k8s.io/batch-user: "true"
rules:
- apiGroups:
  - flink.apache.org
  resources:
  - flinkdeployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - flink.apache.org
  resources:
  - flinkdeployments/status
  verbs:
  - get
