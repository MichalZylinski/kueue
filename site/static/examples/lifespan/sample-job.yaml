apiVersion: batch/v1
kind: Job
metadata:
  generateName: lifespan-sample-job-
  labels:
    kueue.x-k8s.io/queue-name: lifespan-user-queue
  annotations:
    # Expected duration of a single execution attempt, as a Go duration string.
    kueue.x-k8s.io/estimated-duration: "4h"
spec:
  parallelism: 2
  completions: 2
  suspend: true
  template:
    spec:
      containers:
      - name: trainer
        image: registry.k8s.io/e2e-test-images/agnhost:2.53
        args: ["entrypoint-tester"]
        resources:
          requests:
            cpu: "1"
            memory: "512Mi"
      restartPolicy: Never
